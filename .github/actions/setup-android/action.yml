name: Set up Android build
description: Install the JDK, Gradle support, and project Android SDK packages
inputs:
  cache-disabled:
    description: Disable Gradle caching for the signed release build
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-disabled: ${{ inputs.cache-disabled }}
    - name: Set up Android SDK packages
      shell: bash
      run: |
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$RUNNER_TEMP/android-sdk}}"
        if [[ ! -r "$sdk_root/platforms/android-37.0/android.jar" ||
              ! -x "$sdk_root/build-tools/37.0.0/aapt2" ||
              ! -x "$sdk_root/build-tools/37.0.0/apksigner" ]]; then
          sdk_root="$RUNNER_TEMP/android-sdk"
          archive="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --location --retry 3 --output "$archive" \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          printf '%s  %s\n' 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583 "$archive" |
            sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$archive" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" --licenses < <(yes) > /dev/null
          "$sdkmanager" --sdk_root="$sdk_root" "platforms;android-37.0" "build-tools;37.0.0"
        fi
        printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
