name: Set up Android build
description: Install the JDK, Gradle support, and project Android SDK packages
inputs:
  cache-disabled:
    description: Disable Gradle caching for the signed release build
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-disabled: ${{ inputs.cache-disabled }}
    - name: Install Android SDK packages
      shell: bash
      run: |
        sdkmanager --sdk_root="$ANDROID_HOME" --licenses < <(yes) > /dev/null
        sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;37.0.0"
